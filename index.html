<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>i love you.</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,cols,rows,cw,ch,fs,drops;
const RAMP=" .'`^,:;-~+=*xoO#%@";
const KANA='アイウエオカキクケコサシスセソ01♥';
function rs(){
 const d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;
 fs=Math.max(9*d,Math.min(W,H)/62);cw=fs*0.6;ch=fs;cols=Math.floor(W/cw);rows=Math.floor(H/ch);
 drops=Array.from({length:cols},()=>({y:Math.random()*-rows,v:.15+Math.random()*.35,l:6+Math.random()*14|0}));
}
rs();addEventListener('resize',rs);

// shape fields: return brightness 0..1 at normalized coords (x,y), unit ~ 1 = half height
const shapes=[
 // heart
 (x,y,t)=>{x*=1.25;y=-y*1.25+.1;const a=x*x+y*y-1,v=a*a*a-x*x*y*y*y;
  if(v>0)return Math.max(0,1-v*6)*.3; const d=Math.min(1,-v*3);
  return .45+.55*d+.08*Math.sin(Math.atan2(y,x)*8+t*2)*(1-d)},
 // rose (spiral petals)
 (x,y,t)=>flower(x,y,t,5,.95,3.2,1),
 // lily (6 pointed petals)
 (x,y,t)=>flower(x,y,t,6,1.0,7,.6),
 // many-petal bloom
 (x,y,t)=>flower(x,y,t,9,.9,2.2,1.4),
];
function flower(x,y,t,n,R0,sharp,spiral){
 const r=Math.hypot(x,y)*1.05,th=Math.atan2(y,x)+t*.15;
 const p=Math.pow(Math.abs(Math.cos(n*th/2)),sharp>3?sharp*.35:1.2);
 const R=R0*(.45+.55*p)*(1+.03*Math.sin(t));
 if(r>R)return Math.max(0,1-(r-R)*7)*.35;
 const u=r/R;
 const veins=.5+.5*Math.sin(Math.log(r+.02)*7*spiral-th*n*.5+t*.6);
 return Math.min(1,.25+.45*(1-u*.6)+.35*veins*(0.4+u)+.12*Math.sin(th*n*3));
}
const names=['i love you.'];
const DUR=5.4,TR=1.6;
let T0=performance.now();
function ease(k){return k*k*(3-2*k)}
function frame(now){
 const t=(now-T0)/1000;
 g.fillStyle='#000';g.fillRect(0,0,W,H);
 g.font=`${fs}px "Courier New",monospace`;g.textBaseline='top';
 const idx=Math.floor(t/DUR)%shapes.length,nxt=(idx+1)%shapes.length;
 const ph=t%DUR;let m=ph>DUR-TR?ease((ph-(DUR-TR))/TR):0;
 const heartMix=idx===0?1-m:(nxt===0?m:0);
 // rain behind
 for(let i=0;i<cols;i++){const d=drops[i];d.y+=d.v;if(d.y-d.l>rows){d.y=Math.random()*-10;d.v=.15+Math.random()*.35;d.l=6+Math.random()*14|0}
  for(let k=0;k<d.l;k++){const yy=Math.floor(d.y)-k;if(yy<0||yy>=rows)continue;
   const a=(1-k/d.l)*.5;g.fillStyle=k==0?`rgba(255,160,190,${a+.3})`:`rgba(200,30,70,${a*.7})`;
   g.fillText(KANA[(i*7+yy*13+Math.floor(t*6*(k+1)*.2))%KANA.length],i*cw,yy*ch)}}
 // ascii figure
 const sc=Math.min(cols*cw,rows*ch*1.0)/2*.9;
 const cx=cols/2,cy=rows/2;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const x=((i-cx)*cw)/sc,y=((j-cy)*ch)/sc;
  if(Math.abs(x)>1.2||Math.abs(y)>1.2)continue;
  let v=(1-m)*shapes[idx](x,y,t)+m*shapes[nxt](x,y,t);
  // soft glow bloom
  v=Math.max(0,Math.min(1,v));
  if(v<.06)continue;
  const chr=RAMP[Math.min(RAMP.length-1,(v*RAMP.length)|0)];if(chr===' ')continue;
  const L=Math.round(45+v*55);
  // pink for heart, white for flowers
  const hue=330,sat=Math.round(heartMix*85);
  g.fillStyle=`hsl(${hue},${sat}%,${L}%)`;
  g.fillText(chr,i*cw,j*ch);
 }
 // caption
 const cap='i love you.';g.font=`bold ${fs*1.4}px "Courier New",monospace`;g.textAlign='center';
 g.shadowColor='#000';g.shadowBlur=fs*.8;g.fillStyle='#fff';
 g.fillText(cap,W/2,H/2-fs*.7);g.shadowBlur=0;g.textAlign='left';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
